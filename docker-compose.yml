    depends_on:
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${SURREALDB_SPIKE_ADAPTER_PORT_INTERNAL:-8103}
      SPIKE_ADAPTER_NAME: surrealdb_spike
      SPIKE_DATA_ROOT: /data/memory-bank
      SPIKE_REFRESH_SECS: ${SURREALDB_SPIKE_ADAPTER_REFRESH_SECS:-120}
      SPIKE_MAX_DOCS: ${SURREALDB_SPIKE_ADAPTER_MAX_DOCS:-50000}
      SPIKE_MAX_CONTENT_CHARS: ${SURREALDB_SPIKE_ADAPTER_MAX_CONTENT_CHARS:-4096}
