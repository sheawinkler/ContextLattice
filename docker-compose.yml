    image: redis:7
    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH:-change_me}
      - --maxmemory-policy
      - noeviction
    volumes: ["${LF_REDIS_DATA:-lf_redis_data}:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    profiles: ["observability"]

