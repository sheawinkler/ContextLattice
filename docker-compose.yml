name: ${COMPOSE_PROJECT_NAME:-contextlattice}

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:6333:6333", "${HOST_BIND_ADDRESS:-127.0.0.1}:6334:6334"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    # Source can be either a named volume (default) or a host path (e.g., /Volumes/ExternalSSD/contextlattice/qdrant)
    volumes: ["${QDRANT_STORAGE:-qdrant_storage}:/qdrant/storage"]
    restart: unless-stopped
    profiles: ["core"]

  mongo:
    image: mongo:7
    # Source can be either a named volume (default) or a host path (e.g., /Volumes/ExternalSSD/contextlattice/mongo)
    volumes:
      - "${MONGO_DATA:-mongo_data}:/data/db"
      - "${MONGO_CONFIG_DATA:-mongo_config_data}:/data/configdb"
    restart: unless-stopped
    profiles: ["core"]

  # Qdrant MCP (Streamable HTTP)
  mcp-qdrant:
    build: { context: ., dockerfile: Dockerfile.qdrant-mcp }
    depends_on: [qdrant]
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      FASTMCP_SERVER_HOST: 0.0.0.0
      FASTMCP_SERVER_PORT: 8000
    expose: ["8000"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    profiles: ["core"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import socket,sys; s=socket.create_connection(('127.0.0.1',8000),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mindsdb:
    image: mindsdb/mindsdb:v25.14.1
    environment:
      MINDSDB_APIS: ${MINDSDB_APIS}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINDS_HTTP_PORT:-47334}:47334"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINDSDB_MCP_PORT:-47337}:47337"
    volumes: ["${MINDSDB_DATA:-mindsdb_data}:/root/.mindsdb"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    restart: unless-stopped
    profiles: ["analytics"]

  # Memory Bank via npx supergateway -> HTTP/streamable
  memorymcp-http:
    build: { context: ., dockerfile: Dockerfile.memorymcp }
    depends_on: [mongo]
    environment:
      MEMORYMCP_HTTP_PORT: ${MEMORYMCP_HTTP_PORT:-59081}
      MEMORY_BANK_ROOT: /data/memory-bank
      MONGODB_URI: ${MONGODB_URI}
      SUPERGATEWAY_LOG_LEVEL: ${SUPERGATEWAY_LOG_LEVEL:-none}
      SUPERGATEWAY_SESSION_TIMEOUT_MS: ${SUPERGATEWAY_SESSION_TIMEOUT_MS:-300000}
    # Source can be either a named volume (default) or a host path (e.g., /Volumes/ExternalSSD/contextlattice/memory-bank)
    volumes: ["${MEMORY_BANK_DATA:-memory_bank_data}:/data"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${SUPERGW_PORT:-59081}:${MEMORYMCP_HTTP_PORT:-59081}"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    profiles: ["core"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${MEMORYMCP_HTTP_PORT:-59081}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-25m}
        max-file: "${DOCKER_LOG_MAX_FILE:-4}"
    restart: unless-stopped

  # MindsDB SSE -> HTTP using FastMCP
  mindsdb-http-proxy:
    build: { context: ., dockerfile: Dockerfile.mindsdb-http-proxy }
    depends_on: [mindsdb]
    environment:
      MINDSDB_SSE_URL: ${MINDSDB_SSE_URL:-http://mindsdb:47334/mcp/sse}
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${MINDSDB_HTTP_PROXY_PORT:-8004}:8004"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import socket,sys; s=socket.create_connection(('127.0.0.1',8004),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    restart: unless-stopped
    profiles: ["analytics"]

  # MCP Hub — single front door (one port; serves /mcp and /sse)
  mcp-hub:
    image: ghcr.io/tbxark/mcp-proxy:v0.43.2
    depends_on:
      mcp-qdrant:
        condition: service_healthy
      memorymcp-http:
        condition: service_healthy
    volumes:
      - ${MCP_HUB_CONFIG:-./config/mcp/mcp-hub.config.json}:/config/config.json:ro
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        until (echo > "/dev/tcp/memorymcp-http/${MEMORYMCP_HTTP_PORT:-59081}") >/dev/null 2>&1; do
          echo "[mcp-hub] waiting for memorymcp-http:${MEMORYMCP_HTTP_PORT:-59081}"
          sleep 2
        done
        until (echo > "/dev/tcp/mcp-qdrant/8000") >/dev/null 2>&1; do
          echo "[mcp-hub] waiting for mcp-qdrant:8000"
          sleep 2
        done
        exec /main --config /config/config.json
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${MCP_HUB_PORT}:${MCP_HUB_PORT}"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    healthcheck:
      test:
        ["CMD-SHELL",
         "bash -lc 'timeout 3 bash -lc \"exec 3<>/dev/tcp/127.0.0.1/${MCP_HUB_PORT:-53130}; exec 3>&-\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["core"]

  # Ollama (local, free LLMs)
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.18.1}
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:11434:11434"]  # expose to host for testing
    volumes: ["${HOME}/.ollama:/root/.ollama"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-25m}
        max-file: "${DOCKER_LOG_MAX_FILE:-4}"
    profiles: ["llm"]

  # Letta (MemGPT successor). Ollama is optional and only used when explicitly configured.
  letta:
    image: letta/letta:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Letta uses an OpenAI-compatible client; include /v1 if pointing at Ollama.
      OLLAMA_BASE_URL: ${LETTA_OLLAMA_BASE_URL:-}
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${LETTA_PORT}:8283"]
    volumes: ["${LETTA_PGDATA:-letta_pg}:/var/lib/postgresql/data"]
    ulimits: 
      nofile:
       soft: 65536
       hard: 65536
    restart: unless-stopped
    profiles: ["llm"]

  fastembed-sidecar:
    build: { context: ., dockerfile: Dockerfile.fastembed }
    environment:
      FASTEMBED_DEFAULT_MODEL: ${FASTEMBED_DEFAULT_MODEL:-BAAI/bge-small-en-v1.5}
      FASTEMBED_CACHE_DIR: /models
      FASTEMBED_MAX_BATCH: ${FASTEMBED_MAX_BATCH:-256}
    volumes:
      - ${FASTEMBED_MODEL_CACHE:-fastembed_model_cache}:/models
    expose: ["8080"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["core"]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-contextlattice_meili_dev_key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${MEILI_DATA:-meili_data}:/meili_data
    expose: ["7700"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["core"]

  lancedb-spike-adapter:
    build: { context: ., dockerfile: Dockerfile.lancedb-spike-adapter }
    depends_on:
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${LANCEDB_SPIKE_PORT_INTERNAL:-8097}
      LANCEDB_SPIKE_DATA_ROOT: /data/memory-bank
      LANCEDB_SPIKE_DB_URI: ${LANCEDB_SPIKE_DB_URI:-/data/lancedb_spike}
      LANCEDB_SPIKE_TABLE: ${LANCEDB_SPIKE_TABLE:-memory_bank}
      LANCEDB_SPIKE_REFRESH_SECS: ${LANCEDB_SPIKE_REFRESH_SECS:-120}
      LANCEDB_SPIKE_MAX_DOCS: ${LANCEDB_SPIKE_MAX_DOCS:-50000}
      LANCEDB_SPIKE_MAX_CONTENT_CHARS: ${LANCEDB_SPIKE_MAX_CONTENT_CHARS:-4096}
    volumes:
      - ${MEMORY_BANK_DATA:-memory_bank_data}:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${LANCEDB_SPIKE_PORT:-8097}:${LANCEDB_SPIKE_PORT_INTERNAL:-8097}"
    expose: ["${LANCEDB_SPIKE_PORT_INTERNAL:-8097}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LANCEDB_SPIKE_PORT_INTERNAL:-8097}/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
    restart: unless-stopped
    profiles: ["spike-lab"]

  trieve-spike-adapter:
    build: { context: ., dockerfile: Dockerfile.external-spike-adapter }
    depends_on:
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${TRIEVE_SPIKE_ADAPTER_PORT_INTERNAL:-8098}
      SPIKE_ADAPTER_NAME: trieve_spike
      SPIKE_DATA_ROOT: /data/memory-bank
      SPIKE_REFRESH_SECS: ${TRIEVE_SPIKE_ADAPTER_REFRESH_SECS:-120}
      SPIKE_MAX_DOCS: ${TRIEVE_SPIKE_ADAPTER_MAX_DOCS:-50000}
      SPIKE_MAX_CONTENT_CHARS: ${TRIEVE_SPIKE_ADAPTER_MAX_CONTENT_CHARS:-4096}
    volumes:
