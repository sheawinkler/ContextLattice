    volumes: ["${LF_MINIO_DATA:-lf_minio_data}:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped
