      SPIKE_ADAPTER_NAME: helixdb_spike
      SPIKE_DATA_ROOT: /data/memory-bank
      SPIKE_REFRESH_SECS: ${HELIXDB_SPIKE_ADAPTER_REFRESH_SECS:-120}
      SPIKE_MAX_DOCS: ${HELIXDB_SPIKE_ADAPTER_MAX_DOCS:-50000}
      SPIKE_MAX_CONTENT_CHARS: ${HELIXDB_SPIKE_ADAPTER_MAX_CONTENT_CHARS:-4096}
    volumes:
      - ${MEMORY_BANK_DATA:-memory_bank_data}:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HELIXDB_SPIKE_ADAPTER_PORT:-8099}:${HELIXDB_SPIKE_ADAPTER_PORT_INTERNAL:-8099}"
    expose: ["${HELIXDB_SPIKE_ADAPTER_PORT_INTERNAL:-8099}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${HELIXDB_SPIKE_ADAPTER_PORT_INTERNAL:-8099}/health >/dev/null || exit 1"]
