  orchestrator-go:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator-go
    environment:
      PORT: ${GO_ORCHESTRATOR_PORT_INTERNAL:-8090}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${GO_ORCHESTRATOR_PORT_INTERNAL:-8090}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["core"]

