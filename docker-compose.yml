    expose: ["${MEMVID_SPIKE_ADAPTER_PORT_INTERNAL:-8102}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MEMVID_SPIKE_ADAPTER_PORT_INTERNAL:-8102}/health >/dev/null || exit 1"]
