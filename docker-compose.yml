      SPIKE_MAX_DOCS: ${ICM_SPIKE_ADAPTER_MAX_DOCS:-50000}
      SPIKE_MAX_CONTENT_CHARS: ${ICM_SPIKE_ADAPTER_MAX_CONTENT_CHARS:-4096}
    volumes:
