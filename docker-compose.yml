    profiles: ["spike-lab"]

  memory-bank-spike-rs:
    build: { context: ., dockerfile: Dockerfile.memory-bank-spike-rs }
    depends_on:
      meilisearch:
        condition: service_started
      icm-spike-adapter:
        condition: service_started
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${MEMORY_BANK_SPIKE_RS_PORT_INTERNAL:-8096}
      MB_SPIKE_DATA_ROOT: /data/memory-bank
      MB_SPIKE_REFRESH_SECS: ${MEMORY_BANK_SPIKE_RS_REFRESH_SECS:-120}
      MB_SPIKE_MAX_DOCS: ${MEMORY_BANK_SPIKE_RS_MAX_DOCS:-50000}
      MB_SPIKE_MAX_CONTENT_CHARS: ${MEMORY_BANK_SPIKE_RS_MAX_CONTENT_CHARS:-4096}
      MB_SPIKE_MEILI_URL: ${MEMORY_BANK_SPIKE_RS_MEILI_URL:-http://meilisearch:7700}
      MB_SPIKE_MEILI_API_KEY: ${MEILI_MASTER_KEY:-contextlattice_meili_dev_key}
      MB_SPIKE_MEILI_INDEX: ${MEMORY_BANK_SPIKE_RS_MEILI_INDEX:-contextlattice_memory}
      MB_SPIKE_MEILI_SYNC_SECS: ${MEMORY_BANK_SPIKE_RS_MEILI_SYNC_SECS:-300}
      MB_SPIKE_MEILI_TASK_TIMEOUT_SECS: ${MEMORY_BANK_SPIKE_RS_MEILI_TASK_TIMEOUT_SECS:-30}
      MB_SPIKE_EXTERNAL_TIMEOUT_SECS: ${MEMORY_BANK_SPIKE_RS_EXTERNAL_TIMEOUT_SECS:-3}
      MB_SPIKE_EXTERNAL_TIMEOUT_SECS_ICM: ${MEMORY_BANK_SPIKE_RS_EXTERNAL_TIMEOUT_SECS_ICM:-1}
      MB_SPIKE_LANCEDB_URL: ${MEMORY_BANK_SPIKE_RS_LANCEDB_URL:-http://lancedb-spike-adapter:8097}
      MB_SPIKE_LANCEDB_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_LANCEDB_SEARCH_ROUTE:-/search}
      MB_SPIKE_LANCEDB_API_KEY: ${MEMORY_BANK_SPIKE_RS_LANCEDB_API_KEY:-}
      MB_SPIKE_TRIEVE_URL: ${MEMORY_BANK_SPIKE_RS_TRIEVE_URL:-http://trieve-spike-adapter:8098}
      MB_SPIKE_TRIEVE_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_TRIEVE_SEARCH_ROUTE:-/search}
      MB_SPIKE_TRIEVE_API_KEY: ${MEMORY_BANK_SPIKE_RS_TRIEVE_API_KEY:-}
      MB_SPIKE_HELIXDB_URL: ${MEMORY_BANK_SPIKE_RS_HELIXDB_URL:-http://helixdb-spike-adapter:8099}
      MB_SPIKE_HELIXDB_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_HELIXDB_SEARCH_ROUTE:-/search}
      MB_SPIKE_HELIXDB_API_KEY: ${MEMORY_BANK_SPIKE_RS_HELIXDB_API_KEY:-}
      MB_SPIKE_ICM_URL: ${MEMORY_BANK_SPIKE_RS_ICM_URL:-http://icm-spike-adapter:8100}
      MB_SPIKE_ICM_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_ICM_SEARCH_ROUTE:-/search}
      MB_SPIKE_ICM_API_KEY: ${MEMORY_BANK_SPIKE_RS_ICM_API_KEY:-}
      MB_SPIKE_SHODH_URL: ${MEMORY_BANK_SPIKE_RS_SHODH_URL:-http://shodh-spike-adapter:8101}
      MB_SPIKE_SHODH_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_SHODH_SEARCH_ROUTE:-/search}
      MB_SPIKE_SHODH_API_KEY: ${MEMORY_BANK_SPIKE_RS_SHODH_API_KEY:-}
      MB_SPIKE_MEMVID_URL: ${MEMORY_BANK_SPIKE_RS_MEMVID_URL:-http://memvid-spike-adapter:8102}
      MB_SPIKE_MEMVID_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_MEMVID_SEARCH_ROUTE:-/search}
      MB_SPIKE_MEMVID_API_KEY: ${MEMORY_BANK_SPIKE_RS_MEMVID_API_KEY:-}
      MB_SPIKE_SURREALDB_URL: ${MEMORY_BANK_SPIKE_RS_SURREALDB_URL:-http://surrealdb-spike-adapter:8103}
      MB_SPIKE_SURREALDB_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_SURREALDB_SEARCH_ROUTE:-/search}
      MB_SPIKE_SURREALDB_API_KEY: ${MEMORY_BANK_SPIKE_RS_SURREALDB_API_KEY:-}
    volumes:
      - ${MEMORY_BANK_DATA:-memory_bank_data}:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MEMORY_BANK_SPIKE_RS_PORT:-8096}:${MEMORY_BANK_SPIKE_RS_PORT_INTERNAL:-8096}"
    expose: ["${MEMORY_BANK_SPIKE_RS_PORT_INTERNAL:-8096}"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MEMORY_BANK_SPIKE_RS_PORT_INTERNAL:-8096}/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["core"]

  pgvector-db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: ${PGVECTOR_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${PGVECTOR_POSTGRES_DB:-contextlattice}
      POSTGRES_USER: ${PGVECTOR_POSTGRES_USER:-postgres}
    volumes:
      - "${PGVECTOR_DATA:-pgvector_data}:/home/postgres/pgdata/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_POSTGRES_USER:-postgres} -d ${PGVECTOR_POSTGRES_DB:-contextlattice}"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    profiles: ["core"]

  # Observability: Langfuse (app + worker + Postgres + ClickHouse + Redis + MinIO)
  lf-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${LF_DB_PASS:-postgres}
      POSTGRES_DB: ${LF_DB_NAME:-langfuse}
