agent-context:
  - changed-files:
      - any-glob-to-any-file:
          - AGENTS.md
          - config/codex/**
          - scripts/agent/**
          - scripts/agent_hooks/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Makefile

dashboard:
  - changed-files:
      - any-glob-to-any-file:
          - contextlattice-dashboard/**

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.lock"
          - "**/go.sum"
          - "**/package-lock.json"
          - "**/package.json"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile*"
          - "docker-compose*.yml"
          - "**/Dockerfile*"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

go:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.go"
          - "**/go.mod"
          - "**/go.sum"

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - contextlattice-dashboard/**
          - "**/*.js"
          - "**/*.jsx"
          - "**/*.ts"
          - "**/*.tsx"

runtime:
  - changed-files:
      - any-glob-to-any-file:
          - .env.example
          - config/env/**
          - "docker-compose*.yml"
          - services/gateway-go/**

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

security:
  - changed-files:
      - any-glob-to-any-file:
          - contextlattice-dashboard/lib/auth/**
          - contextlattice-dashboard/lib/callback-url.ts
          - contextlattice-dashboard/proxy.ts
          - scripts/agent_hooks/public_leak_guard.sh
