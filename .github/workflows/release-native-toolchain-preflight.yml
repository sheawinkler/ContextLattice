name: Native Release Toolchain Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-native-toolchain-preflight.yml'
      - '.github/workflows/public-release-installers.yml'
      - '.github/workflows/release-installers.yml'
      - 'scripts/release_native_toolchain_preflight.py'
      - 'scripts/release_native_ci_profile.py'
      - 'scripts/release_native_ci_gate.py'
      - 'scripts/release_native_containment_holdouts.py'
      - 'scripts/tests/test_release_native*'
      - 'scripts/agent/audit-public-installer-package'

permissions:
  contents: read

jobs:
  native-msi-containment:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check diagnostic contracts
        run: python3 -m unittest scripts.tests.test_release_native_toolchain_preflight scripts.tests.test_release_native_ci_profile scripts.tests.test_release_native_ci_gate
      - name: Install reviewed native tool versions
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = 'ubuntu:24.04'
          sudo apt-get update
          sudo apt-get install -y msitools=0.103+repack-1build3 bubblewrap=0.9.0-1ubuntu0.3
          test "$(dpkg-query -W msitools | cut -f2)" = '0.103+repack-1build3'
          test "$(dpkg-query -W bubblewrap | cut -f2)" = '0.9.0-1ubuntu0.3'
      - name: Probe the real audit containment without parsing an installer
        id: baseline
        continue-on-error: true
        run: |
          set +e
          date +%s > native-probe-started
          {
            uname -a
            id
            cat /proc/self/attr/current
            cat /sys/module/apparmor/parameters/enabled
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            sudo cat /sys/kernel/security/apparmor/profiles
            dpkg-query -W apparmor bubblewrap msitools
            stat -c '%n %U %G %a' /usr /usr/bin /usr/bin/bwrap /usr/bin/msiinfo /usr/bin/msiextract
            getcap /usr/bin/bwrap /usr/bin/msiinfo /usr/bin/msiextract
          } > native-toolchain-identity.txt 2>&1
          python3 scripts/release_native_toolchain_preflight.py > native-toolchain-preflight.json
          result=$?
          # Only the journal read needs privilege; output stays runner-owned.
          # shellcheck disable=SC2024
          sudo journalctl -k --since "@$(cat native-probe-started)" --no-pager --output=json \
            --grep='apparmor="DENIED".*(bwrap|unprivileged_userns)' > native-toolchain-kernel-denials.jsonl 2> native-toolchain-kernel-read.stderr
          cat native-toolchain-preflight.json
          cat native-toolchain-kernel-denials.jsonl
          exit "$result"
      - name: Prepare the reviewed distribution profile only after fresh attributed denial
        if: steps.baseline.outcome == 'failure'
        env:
          CONTEXTLATTICE_OWNED_NATIVE_CI: 'true'
        run: |
          set -euo pipefail
          python3 scripts/release_native_ci_profile.py --prepare-github-hosted-ci | tee native-toolchain-profile.json
      - name: Require contained tools and fixed isolation negatives
        run: |
          python3 scripts/release_native_toolchain_preflight.py > native-toolchain-final.json
          python3 scripts/release_native_containment_holdouts.py > native-toolchain-holdouts.json
      - name: Verify the workflow/source tooling join
        env:
          NATIVE_TOOLING_COMMIT: ${{ github.workflow_sha }}
          CONTEXTLATTICE_OWNED_NATIVE_CI: 'true'
        run: python3 scripts/release_native_ci_gate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-toolchain-preflight
          path: |
            native-toolchain-preflight.json
            native-toolchain-identity.txt
            native-toolchain-kernel-denials.jsonl
            native-toolchain-kernel-read.stderr
            native-toolchain-profile.json
            native-toolchain-final.json
            native-toolchain-holdouts.json
            ${{ runner.temp }}/native-containment-*.json
          if-no-files-found: error
          retention-days: 7
