name: Public Release Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable vX.Y.Z tag or optional vX.Y.Z-public alias"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: public-release-installers-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  RELEASE_LANE: public
  APPROVED_SOURCE_REPOSITORY: sheawinkler/ContextLattice
  APPROVED_SOURCE_REF: refs/heads/main
  APPROVED_SOURCE_TRACKING_REF: refs/remotes/public/main

jobs:
  verify-release:
    name: Verify public tag provenance
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
      tag: ${{ steps.provenance.outputs.tag }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check release note hygiene
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: python3 scripts/release_notes_hygiene.py --text "$RELEASE_BODY"

      - name: Verify stable tag and public/main provenance
        id: provenance
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail

          stable_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          public_alias_re='^v[0-9]+\.[0-9]+\.[0-9]+-public$'
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_TAG" =~ $stable_tag_re ]] || {
              echo "ERROR: published public releases require a stable vX.Y.Z tag." >&2
              exit 1
            }
            [[ "$RELEASE_PRERELEASE" != "true" ]] || {
              echo "ERROR: public installer releases must not be prereleases." >&2
              exit 1
            }
          elif [[ ! "$RELEASE_TAG" =~ $stable_tag_re && ! "$RELEASE_TAG" =~ $public_alias_re ]]; then
            echo "ERROR: dispatch tag must be vX.Y.Z or vX.Y.Z-public." >&2
            exit 1
          fi

          tag_refspecs=("+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" =~ $public_alias_re ]]; then
            canonical_tag="${RELEASE_TAG%-public}"
            tag_refspecs+=("+refs/tags/${canonical_tag}:refs/tags/${canonical_tag}")
          fi

          git remote remove public 2>/dev/null || true
          git remote add public "https://github.com/${APPROVED_SOURCE_REPOSITORY}.git"
          git fetch --force --no-tags public \
            "+${APPROVED_SOURCE_REF}:${APPROVED_SOURCE_TRACKING_REF}" \
            "${tag_refspecs[@]}"

          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify HEAD)"
          source_ref_tip="$(git rev-parse --verify "${APPROVED_SOURCE_TRACKING_REF}^{commit}")"

          [[ "$tag_commit" == "$checkout_commit" ]] || {
            echo "ERROR: checkout does not match exact public release tag." >&2
            exit 1
          }
          if [[ -n "${canonical_tag:-}" ]]; then
            canonical_commit="$(git rev-parse --verify "refs/tags/${canonical_tag}^{commit}")"
            [[ "$canonical_commit" == "$tag_commit" ]] || {
              echo "ERROR: public alias and canonical stable tag resolve to different commits." >&2
              exit 1
            }
          fi
          git merge-base --is-ancestor "$tag_commit" "$source_ref_tip" || {
            echo "ERROR: tagged commit is not reachable from public/main." >&2
            exit 1
          }

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Audit exact public release tree
        env:
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.commit }}
        run: |
          set -euo pipefail
          audit_tag="$RELEASE_TAG"
          if [[ "$audit_tag" == *-public ]]; then
            audit_tag="${audit_tag%-public}"
          fi
          scripts/agent_hooks/branch_lane_guard.sh \
            --lane public \
            --ref "refs/tags/${RELEASE_TAG}"
          scripts/agent_hooks/public_leak_guard.sh \
            --mode all \
            --ref "refs/tags/${RELEASE_TAG}" \
            --public
          python3 scripts/generate_commercial_truth.py --check
          scripts/agent/audit-commercial-truth --release-tag "$audit_tag"
          scripts/agent/audit-release-lane-tree \
            --lane public \
            --ref "refs/tags/${RELEASE_TAG}" \
            --expected-commit "$EXPECTED_RELEASE_COMMIT" \
            --release-ref "refs/tags/${RELEASE_TAG}" \
            --proof-out dist/ContextLattice-release-tree-proof.json

      - name: Upload exact public release-tree proof
        uses: actions/upload-artifact@v7
        with:
          name: public-release-tree-proof
          path: dist/ContextLattice-release-tree-proof.json
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS DMG
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: macos-latest
    needs: verify-release
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify public tag checkout
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          tag_refspecs=("+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-public ]]; then
            canonical_tag="${RELEASE_TAG%-public}"
            tag_refspecs+=("+refs/tags/${canonical_tag}:refs/tags/${canonical_tag}")
          fi
          git remote remove public 2>/dev/null || true
          git remote add public "https://github.com/${APPROVED_SOURCE_REPOSITORY}.git"
          git fetch --force --no-tags public \
            "+${APPROVED_SOURCE_REF}:${APPROVED_SOURCE_TRACKING_REF}" \
            "${tag_refspecs[@]}"

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify HEAD)"
          source_ref_tip="$(git rev-parse --verify "${APPROVED_SOURCE_TRACKING_REF}^{commit}")"
          [[ "$tag_commit" == "$checkout_commit" ]]
          [[ "$checkout_commit" == "$EXPECTED_RELEASE_COMMIT" ]]
          if [[ -n "${canonical_tag:-}" ]]; then
            [[ "$(git rev-parse --verify "refs/tags/${canonical_tag}^{commit}")" == "$checkout_commit" ]]
          fi
          git merge-base --is-ancestor "$checkout_commit" "$source_ref_tip"
          echo "RELEASE_COMMIT=$checkout_commit" >> "$GITHUB_ENV"

      - name: Import macOS signing identity (optional)
        env:
          CONTEXTLATTICE_MACOS_CERT_P12_BASE64: ${{ secrets.CONTEXTLATTICE_MACOS_CERT_P12_BASE64 }}
          CONTEXTLATTICE_MACOS_CERT_P12_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_CERT_P12_PASSWORD }}
          CONTEXTLATTICE_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_KEYCHAIN_PASSWORD }}
          CONTEXTLATTICE_MACOS_CODESIGN_IDENTITY: ${{ secrets.CONTEXTLATTICE_MACOS_CODESIGN_IDENTITY }}
          CONTEXTLATTICE_MACOS_SIGNING_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_SIGNING_REQUIRED }}
        run: bash scripts/macos_import_signing_identity.sh

      - name: Build public DMG
        run: bash scripts/build_macos_dmg.sh

      - name: Sign and notarize macOS artifact (optional)
        env:
          CONTEXTLATTICE_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEYCHAIN_PROFILE }}
          CONTEXTLATTICE_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEY_P8_BASE64 }}
          CONTEXTLATTICE_MACOS_NOTARY_KEY_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEY_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_ISSUER_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_APPLE_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_APPLE_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_TEAM_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_TEAM_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_PASSWORD }}
          CONTEXTLATTICE_MACOS_SIGNING_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_SIGNING_REQUIRED }}
          CONTEXTLATTICE_MACOS_NOTARIZATION_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_NOTARIZATION_REQUIRED }}
        run: bash scripts/macos_sign_notarize_release.sh dist/ContextLattice-macOS-universal.dmg

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-dmg
          path: dist/ContextLattice-macOS-universal.dmg
          if-no-files-found: error

  build-linux-and-msi:
    name: Build Linux bundle and Windows MSI
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify public tag checkout
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          tag_refspecs=("+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-public ]]; then
            canonical_tag="${RELEASE_TAG%-public}"
            tag_refspecs+=("+refs/tags/${canonical_tag}:refs/tags/${canonical_tag}")
          fi
          git remote remove public 2>/dev/null || true
          git remote add public "https://github.com/${APPROVED_SOURCE_REPOSITORY}.git"
          git fetch --force --no-tags public \
            "+${APPROVED_SOURCE_REF}:${APPROVED_SOURCE_TRACKING_REF}" \
            "${tag_refspecs[@]}"

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify HEAD)"
          source_ref_tip="$(git rev-parse --verify "${APPROVED_SOURCE_TRACKING_REF}^{commit}")"
          [[ "$tag_commit" == "$checkout_commit" ]]
          [[ "$checkout_commit" == "$EXPECTED_RELEASE_COMMIT" ]]
          if [[ -n "${canonical_tag:-}" ]]; then
            [[ "$(git rev-parse --verify "refs/tags/${canonical_tag}^{commit}")" == "$checkout_commit" ]]
          fi
          git merge-base --is-ancestor "$checkout_commit" "$source_ref_tip"
          echo "RELEASE_COMMIT=$checkout_commit" >> "$GITHUB_ENV"

      - name: Build public Linux bundle
        run: bash scripts/build_linux_bundle.sh

      - name: Build public Windows MSI
        env:
          MSI_VERSION: ${{ needs.verify-release.outputs.tag }}
        run: bash scripts/build_windows_msi.sh

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-linux
          path: dist/ContextLattice-linux-bootstrap.tar.gz
          if-no-files-found: error

      - name: Upload MSI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-msi
          path: dist/ContextLattice-windows-x64.msi
          if-no-files-found: error

  publish-assets:
    name: Publish three public installer assets
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - build-macos-dmg
      - build-linux-and-msi
    steps:
      - name: Download macOS installer artifact
        uses: actions/download-artifact@v8
        with:
          name: public-release-dmg
          path: dist

      - name: Download Linux installer artifact
        uses: actions/download-artifact@v8
        with:
          name: public-release-linux
          path: dist

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: public-release-msi
          path: dist

      - name: Verify exact asset set
        run: |
          set -euo pipefail
          expected=(
            ContextLattice-macOS-universal.dmg
            ContextLattice-linux-bootstrap.tar.gz
            ContextLattice-windows-x64.msi
          )
          for name in "${expected[@]}"; do
            [[ -s "dist/$name" ]] || {
              echo "ERROR: required public release asset is missing: $name" >&2
              exit 1
            }
          done
          [[ "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" == "3" ]] || {
            echo "ERROR: public release upload must contain exactly three files." >&2
            find dist -maxdepth 1 -type f -print >&2
            exit 1
          }

      - name: Publish or overwrite installer assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify-release.outputs.tag }}
          make_latest: ${{ endsWith(needs.verify-release.outputs.tag, '-public') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/ContextLattice-macOS-universal.dmg
            dist/ContextLattice-linux-bootstrap.tar.gz
            dist/ContextLattice-windows-x64.msi
