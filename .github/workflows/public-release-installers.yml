name: Public Release Installers

on:
  push:
    tags:
      - 'v*'
      - '!v*-public-paid'
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable vX.Y.Z tag or optional vX.Y.Z-public alias"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: public-release-installers-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  RELEASE_LANE: public
  APPROVED_SOURCE_REPOSITORY: sheawinkler/ContextLattice
  APPROVED_SOURCE_REF: refs/heads/main
  APPROVED_SOURCE_TRACKING_REF: refs/remotes/public/main

jobs:
  prepare-release:
    name: Prepare immutable draft release
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          public_alias_re='^v[0-9]+\.[0-9]+\.[0-9]+-public$'
          [[ "$RELEASE_TAG" =~ $stable_tag_re || "$RELEASE_TAG" =~ $public_alias_re ]] || {
            echo "ERROR: public release tag must be vX.Y.Z or vX.Y.Z-public." >&2
            exit 1
          }
          if release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
              echo "ERROR: release already exists as promoted; refusing to mutate it." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
            echo "ERROR: release is not draft after preparation." >&2
            exit 1
          }

  verify-release:
    name: Verify public tag provenance
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs: prepare-release
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
      tag: ${{ steps.provenance.outputs.tag }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

      - name: Check draft release note hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          python3 scripts/release_notes_hygiene.py --text "$body"

      - name: Verify stable tag and public/main provenance
        id: provenance
        run: |
          set -euo pipefail
          stable_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          public_alias_re='^v[0-9]+\.[0-9]+\.[0-9]+-public$'
          if [[ ! "$RELEASE_TAG" =~ $stable_tag_re && ! "$RELEASE_TAG" =~ $public_alias_re ]]; then
            echo "ERROR: dispatch tag must be vX.Y.Z or vX.Y.Z-public." >&2
            exit 1
          fi

          tag_refspecs=("+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" =~ $public_alias_re ]]; then
            canonical_tag="${RELEASE_TAG%-public}"
            tag_refspecs+=("+refs/tags/${canonical_tag}:refs/tags/${canonical_tag}")
          fi
          git remote remove public 2>/dev/null || true
          git remote add public "https://github.com/${APPROVED_SOURCE_REPOSITORY}.git"
          git fetch --force --no-tags public \
            "+${APPROVED_SOURCE_REF}:${APPROVED_SOURCE_TRACKING_REF}" \
            "${tag_refspecs[@]}"

          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse --verify HEAD)"
          source_ref_tip="$(git rev-parse --verify "${APPROVED_SOURCE_TRACKING_REF}^{commit}")"
          [[ "$tag_commit" == "$checkout_commit" ]] || {
            echo "ERROR: checkout does not match exact public release tag." >&2
            exit 1
          }
          if [[ -n "${canonical_tag:-}" ]]; then
            canonical_commit="$(git rev-parse --verify "refs/tags/${canonical_tag}^{commit}")"
            [[ "$canonical_commit" == "$tag_commit" ]] || {
              echo "ERROR: public alias and canonical stable tag resolve to different commits." >&2
              exit 1
            }
          fi
          git merge-base --is-ancestor "$tag_commit" "$source_ref_tip"
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Audit exact public release tree
        env:
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.commit }}
        run: |
          set -euo pipefail
          scripts/agent_hooks/branch_lane_guard.sh \
            --lane public \
            --ref "refs/tags/${RELEASE_TAG}"
          scripts/agent_hooks/public_leak_guard.sh \
            --mode all \
            --ref "refs/tags/${RELEASE_TAG}" \
            --public
          python3 scripts/generate_commercial_truth.py --check
          scripts/agent/audit-commercial-truth --release-tag "${RELEASE_TAG%-public}"
          scripts/agent/audit-release-lane-tree \
            --lane public \
            --ref "refs/tags/${RELEASE_TAG}" \
            --expected-commit "$EXPECTED_RELEASE_COMMIT" \
            --release-ref "refs/tags/${RELEASE_TAG}" \
            --proof-out dist/ContextLattice-release-tree-proof.json

      - name: Upload public tree proof for build jobs
        uses: actions/upload-artifact@v7
        with:
          name: public-release-tree-proof
          path: dist/ContextLattice-release-tree-proof.json
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS DMG
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: macos-latest
    needs: verify-release
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]
          echo "RELEASE_COMMIT=$EXPECTED_RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Import macOS signing identity (optional)
        env:
          CONTEXTLATTICE_MACOS_CERT_P12_BASE64: ${{ secrets.CONTEXTLATTICE_MACOS_CERT_P12_BASE64 }}
          CONTEXTLATTICE_MACOS_CERT_P12_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_CERT_P12_PASSWORD }}
          CONTEXTLATTICE_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_KEYCHAIN_PASSWORD }}
          CONTEXTLATTICE_MACOS_CODESIGN_IDENTITY: ${{ secrets.CONTEXTLATTICE_MACOS_CODESIGN_IDENTITY }}
          CONTEXTLATTICE_MACOS_SIGNING_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_SIGNING_REQUIRED }}
        run: bash scripts/macos_import_signing_identity.sh

      - name: Build public DMG
        run: bash scripts/build_macos_dmg.sh

      - name: Sign and notarize macOS artifact (optional)
        env:
          CONTEXTLATTICE_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEYCHAIN_PROFILE }}
          CONTEXTLATTICE_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEY_P8_BASE64 }}
          CONTEXTLATTICE_MACOS_NOTARY_KEY_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_KEY_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_ISSUER_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_APPLE_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_APPLE_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_TEAM_ID: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_TEAM_ID }}
          CONTEXTLATTICE_MACOS_NOTARY_PASSWORD: ${{ secrets.CONTEXTLATTICE_MACOS_NOTARY_PASSWORD }}
          CONTEXTLATTICE_MACOS_SIGNING_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_SIGNING_REQUIRED }}
          CONTEXTLATTICE_MACOS_NOTARIZATION_REQUIRED: ${{ vars.CONTEXTLATTICE_MACOS_NOTARIZATION_REQUIRED }}
        run: bash scripts/macos_sign_notarize_release.sh dist/ContextLattice-macOS-universal.dmg

      - name: Verify final DMG is a regular non-empty file
        run: test -s dist/ContextLattice-macOS-universal.dmg && test ! -L dist/ContextLattice-macOS-universal.dmg

      - name: Audit final DMG package contents
        run: |
          set -euo pipefail
          scripts/agent/audit-public-installer-package \
            --kind macos \
            --artifact dist/ContextLattice-macOS-universal.dmg \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-macOS-universal.dmg.package-audit.json"

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-dmg
          path: dist/ContextLattice-macOS-universal.dmg
          if-no-files-found: error

      - name: Upload digest-bound DMG package audit
        uses: actions/upload-artifact@v7
        with:
          name: public-release-dmg-package-audit
          path: ${{ runner.temp }}/ContextLattice-macOS-universal.dmg.package-audit.json
          if-no-files-found: error

  build-linux-and-msi:
    name: Build Linux bundle and Windows MSI
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]
          echo "RELEASE_COMMIT=$EXPECTED_RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Build public Linux bundle
        run: bash scripts/build_linux_bundle.sh

      - name: Build public Windows MSI
        env:
          MSI_VERSION: ${{ needs.verify-release.outputs.tag }}
        run: bash scripts/build_windows_msi.sh

      - name: Verify final Linux and MSI files
        run: |
          set -euo pipefail
          test -s dist/ContextLattice-linux-bootstrap.tar.gz
          test -s dist/ContextLattice-windows-x64.msi
          test ! -L dist/ContextLattice-linux-bootstrap.tar.gz
          test ! -L dist/ContextLattice-windows-x64.msi

      - name: Install and attest MSI audit tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          msitools_version='0.103-3build1'
          bubblewrap_version='0.9.0-1ubuntu0.1'
          sudo apt-get install -y "msitools=${msitools_version}" "bubblewrap=${bubblewrap_version}"
          test "$(dpkg-query -W -f='${Version}' msitools)" = "$msitools_version"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$bubblewrap_version"
          for tool in bwrap msiinfo msiextract; do
            tool_path="$(command -v "$tool")"
            test -x "$tool_path"
            "$tool" --version
            sha256sum "$tool_path"
          done

      - name: Audit final Linux and MSI package contents
        run: |
          set -euo pipefail
          scripts/agent/audit-public-installer-package \
            --kind linux \
            --artifact dist/ContextLattice-linux-bootstrap.tar.gz \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-linux-bootstrap.tar.gz.package-audit.json"
          scripts/agent/audit-public-installer-package \
            --kind windows \
            --artifact dist/ContextLattice-windows-x64.msi \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --containment-tool bwrap \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-windows-x64.msi.package-audit.json"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-linux
          path: dist/ContextLattice-linux-bootstrap.tar.gz
          if-no-files-found: error

      - name: Upload MSI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-release-msi
          path: dist/ContextLattice-windows-x64.msi
          if-no-files-found: error

      - name: Upload digest-bound Linux and MSI package audits
        uses: actions/upload-artifact@v7
        with:
          name: public-release-linux-msi-package-audits
          path: |
            ${{ runner.temp }}/ContextLattice-linux-bootstrap.tar.gz.package-audit.json
            ${{ runner.temp }}/ContextLattice-windows-x64.msi.package-audit.json
          if-no-files-found: error

  publish-assets:
    name: Publish public installers and integrity metadata
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - build-macos-dmg
      - build-linux-and-msi
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]
          echo "RELEASE_COMMIT=$EXPECTED_RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Download final macOS installer bytes
        uses: actions/download-artifact@v8
        with:
          name: public-release-dmg
          path: dist

      - name: Download final Linux installer bytes
        uses: actions/download-artifact@v8
        with:
          name: public-release-linux
          path: dist

      - name: Download final Windows installer bytes
        uses: actions/download-artifact@v8
        with:
          name: public-release-msi
          path: dist

      - name: Download digest-bound build package audits
        uses: actions/download-artifact@v8
        with:
          pattern: public-release-*-package-audit*
          path: ${{ runner.temp }}/build-package-audits
          merge-multiple: true

      - name: Verify closed installer set before metadata generation
        run: |
          set -euo pipefail
          expected=(
            ContextLattice-macOS-universal.dmg
            ContextLattice-linux-bootstrap.tar.gz
            ContextLattice-windows-x64.msi
          )
          for name in "${expected[@]}"; do
            test -s "dist/$name"
            test ! -L "dist/$name"
          done
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort)"
          actual_sorted="$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual_sorted" == "$expected_sorted" ]] || {
            printf '%s\n' "$actual_sorted" >&2
            exit 1
          }

      - name: Verify exact build package audits before metadata generation
        run: |
          set -euo pipefail
          for row in \
            'macos ContextLattice-macOS-universal.dmg' \
            'linux ContextLattice-linux-bootstrap.tar.gz' \
            'windows ContextLattice-windows-x64.msi'; do
            read -r kind name <<<"$row"
            scripts/agent/audit-public-installer-package \
              --kind "$kind" \
              --artifact "dist/$name" \
              --root . \
              --lane public \
              --tag "$RELEASE_TAG" \
              --temp-dir "$RUNNER_TEMP" \
              --containment-tool bwrap \
              --receipt-in "$RUNNER_TEMP/build-package-audits/$name.package-audit.json" \
              --verify-receipt-only
          done

      - name: Generate final-byte checksums, manifest, and provenance
        run: |
          set -euo pipefail
          python3 scripts/release_artifact_manifest.py \
            --dist-dir dist \
            --lane public \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --provenance-name ContextLattice-release-provenance.json \
            --public-safe \
            --verify

      - name: Install pinned Syft and verify its version
        env:
          SYFT_VERSION: "1.32.0"
          SYFT_ARCHIVE_SHA256: "d6400b579fa84dd383573b1d1ff6f081a37fc64d3ffaafdfdda95c4325f204be"
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          checksums_path="$RUNNER_TEMP/syft-checksums.txt"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}" \
            -o "$archive_path"
          scripts/agent/verify-release-archive-sha256 \
            --archive "$archive_path" \
            --sha256 "$SYFT_ARCHIVE_SHA256"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt" \
            -o "$checksums_path"
          checksum_line="$(grep -E "  ${archive}$" "$checksums_path")"
          test "$(printf '%s\n' "$checksum_line" | wc -l | tr -d ' ')" = 1
          [[ "$checksum_line" == "${SYFT_ARCHIVE_SHA256}  ${archive}" ]] || {
            echo "ERROR: Syft checksum file disagrees with the pinned archive digest." >&2
            exit 1
          }
          printf '%s\n' "$checksum_line" | (cd "$RUNNER_TEMP" && sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/syft-bin"
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/syft-bin" syft
          test -x "$RUNNER_TEMP/syft-bin/syft"
          version_output="$("$RUNNER_TEMP/syft-bin/syft" version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -F "${SYFT_VERSION}"
          echo "SYFT_BIN=$RUNNER_TEMP/syft-bin/syft" >> "$GITHUB_ENV"

      - name: Generate real post-final-byte SPDX SBOMs
        run: |
          set -euo pipefail
          for name in \
            ContextLattice-macOS-universal.dmg \
            ContextLattice-windows-x64.msi \
            ContextLattice-linux-bootstrap.tar.gz; do
            "$SYFT_BIN" "file:dist/$name" \
              -o "spdx-json=dist/$name.sbom.spdx.json"
            test -s "dist/$name.sbom.spdx.json"
          done

      - name: Generate immutable final SBOM bindings
        run: |
          set -euo pipefail
          python3 scripts/release_artifact_manifest.py \
            --dist-dir dist \
            --lane public \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --provenance-name ContextLattice-release-provenance.json \
            --integrity-dir dist \
            --sbom-dir dist \
            --public-safe \
            --verify

      - name: Audit final bytes, private-material scan, SPDX SBOMs, and public metadata
        run: |
          set -euo pipefail
          scripts/agent/audit-public-release-assets \
            --dist-dir dist \
            --lane public \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Preflight draft assets and recover only identical bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            ContextLattice-macOS-universal.dmg
            ContextLattice-linux-bootstrap.tar.gz
            ContextLattice-windows-x64.msi
            ContextLattice-SHA256SUMS.txt
            ContextLattice-release-manifest-stable.json
            ContextLattice-release-provenance.json
            ContextLattice-macOS-universal.dmg.integrity.json
            ContextLattice-windows-x64.msi.integrity.json
            ContextLattice-linux-bootstrap.tar.gz.integrity.json
            ContextLattice-macOS-universal.dmg.sbom.spdx.json
            ContextLattice-windows-x64.msi.sbom.spdx.json
            ContextLattice-linux-bootstrap.tar.gz.sbom.spdx.json
          )
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
            echo "ERROR: release is promoted; refusing asset mutation." >&2
            exit 1
          }
          existing="$(jq -r '.assets[].name' <<<"$release_json")"
          remote_dist="$(mktemp -d "$RUNNER_TEMP/public-release-existing.XXXXXX")"
          recovered_receipt_dir="$RUNNER_TEMP/public-release-recovered"
          mkdir -p "$recovered_receipt_dir"
          echo "RECOVERED_RELEASE_RECEIPT_DIR=$recovered_receipt_dir" >> "$GITHUB_ENV"
          bound_names=()
          mark_bound() {
            bound_names+=("$1")
          }
          is_bound() {
            local candidate="$1"
            local bound
            for bound in "${bound_names[@]}"; do
              [[ "$candidate" == "$bound" ]] && return 0
            done
            return 1
          }
          for name in $existing; do
            case "$name" in
              ContextLattice-macOS-universal.dmg|ContextLattice-linux-bootstrap.tar.gz|ContextLattice-windows-x64.msi|ContextLattice-SHA256SUMS.txt|ContextLattice-release-manifest-stable.json|ContextLattice-release-provenance.json|ContextLattice-macOS-universal.dmg.integrity.json|ContextLattice-windows-x64.msi.integrity.json|ContextLattice-linux-bootstrap.tar.gz.integrity.json|ContextLattice-macOS-universal.dmg.sbom.spdx.json|ContextLattice-windows-x64.msi.sbom.spdx.json|ContextLattice-linux-bootstrap.tar.gz.sbom.spdx.json) ;;
              *)
                echo "ERROR: draft contains an unexpected asset $name; refusing deletion or overwrite." >&2
                exit 1
                ;;
            esac
          done
          for installer in \
            ContextLattice-macOS-universal.dmg \
            ContextLattice-windows-x64.msi \
            ContextLattice-linux-bootstrap.tar.gz; do
            sbom="$installer.sbom.spdx.json"
            receipt="$installer.integrity.json"
            if printf '%s\n' "$existing" | grep -Fqx "$sbom"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$sbom" \
                --dir "$remote_dist"
              if printf '%s\n' "$existing" | grep -Fqx "$receipt"; then
                gh release download "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$receipt" \
                  --dir "$remote_dist"
                scripts/agent/verify-release-sbom-binding \
                  --artifact "dist/$installer" \
                  --sbom "$remote_dist/$sbom" \
                  --receipt "$remote_dist/$receipt" \
                  --lane public \
                  --tag "$RELEASE_TAG" \
                  --commit "$RELEASE_COMMIT" \
                  --failure-report "$RUNNER_TEMP/${installer}.sbom-repair-required.json"
                mark_bound "$sbom"
                mark_bound "$receipt"
              else
                repair_report="$RUNNER_TEMP/${installer}.sbom-repair-required.json"
                if ! scripts/agent/verify-release-sbom-binding \
                  --artifact "dist/$installer" \
                  --sbom "$remote_dist/$sbom" \
                  --receipt "$recovered_receipt_dir/$receipt" \
                  --lane public \
                  --tag "$RELEASE_TAG" \
                  --commit "$RELEASE_COMMIT" \
                  --write-receipt \
                  --failure-report "$repair_report"; then
                  echo "ERROR: SBOM-only draft state requires operator repair; report: $repair_report" >&2
                  exit 1
                fi
                mark_bound "$sbom"
                echo "recovered immutable receipt for existing SBOM: $sbom"
              fi
            elif printf '%s\n' "$existing" | grep -Fqx "$receipt"; then
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$receipt" \
                --dir "$remote_dist"
              if ! scripts/agent/verify-release-sbom-binding \
                --artifact "dist/$installer" \
                --sbom "dist/$sbom" \
                --receipt "$remote_dist/$receipt" \
                --lane public \
                --tag "$RELEASE_TAG" \
                --commit "$RELEASE_COMMIT" \
                --failure-report "$RUNNER_TEMP/${installer}.sbom-repair-required.json"; then
                echo "ERROR: receipt-only draft state requires operator repair: $RUNNER_TEMP/${installer}.sbom-repair-required.json" >&2
                exit 1
              fi
              mark_bound "$receipt"
            fi
          done
          for name in "${files[@]}"; do
            if printf '%s\n' "$existing" | grep -Fqx "$name"; then
              if [[ ! -f "$remote_dist/$name" ]]; then
                gh release download "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$name" \
                  --dir "$remote_dist"
              fi
              test -f "$remote_dist/$name"
              if is_bound "$name"; then
                echo "verified existing SBOM binding receipt: $name"
                continue
              fi
              cmp -s "dist/$name" "$remote_dist/$name" || {
                echo "ERROR: existing draft asset $name differs; refusing overwrite." >&2
                exit 1
              }
              echo "verified existing identical draft asset: $name"
            fi
          done

      - name: Upload missing draft assets without replacing existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            dist/ContextLattice-macOS-universal.dmg
            dist/ContextLattice-linux-bootstrap.tar.gz
            dist/ContextLattice-windows-x64.msi
            dist/ContextLattice-SHA256SUMS.txt
            dist/ContextLattice-release-manifest-stable.json
            dist/ContextLattice-release-provenance.json
            dist/ContextLattice-macOS-universal.dmg.integrity.json
            dist/ContextLattice-windows-x64.msi.integrity.json
            dist/ContextLattice-linux-bootstrap.tar.gz.integrity.json
            dist/ContextLattice-macOS-universal.dmg.sbom.spdx.json
            dist/ContextLattice-windows-x64.msi.sbom.spdx.json
            dist/ContextLattice-linux-bootstrap.tar.gz.sbom.spdx.json
          )
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
            echo "ERROR: release is promoted; refusing asset mutation." >&2
            exit 1
          }
          existing="$(jq -r '.assets[].name' <<<"$release_json")"
          recovered_dir="${RECOVERED_RELEASE_RECEIPT_DIR:-}"
          missing=()
          for file in "${files[@]}"; do
            name="${file##*/}"
            candidate="$file"
            if [[ -n "$recovered_dir" && -f "$recovered_dir/$name" ]]; then
              candidate="$recovered_dir/$name"
            fi
            test -f "$candidate"
            if ! printf '%s\n' "$existing" | grep -Fqx "$name"; then
              missing+=("$candidate")
            fi
          done
          if (( ${#missing[@]} )); then
            # The upload intentionally has no overwrite flag. A failed run
            # leaves this draft recoverable; a rerun uploads only missing
            # assets after comparing every existing byte.
            gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
          else
            echo "all expected assets already exist with verified bytes"
          fi

  audit-remote-macos:
    name: Independently audit downloaded remote DMG
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: macos-latest
    needs:
      - verify-release
      - publish-assets
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]

      - name: Download DMG from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]]
          remote_dist="$(mktemp -d "$RUNNER_TEMP/public-release-remote-dmg.XXXXXX")"
          echo "REMOTE_DIST=$remote_dist" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ContextLattice-macOS-universal.dmg \
            --dir "$remote_dist"

      - name: Audit downloaded DMG package contents
        run: |
          set -euo pipefail
          scripts/agent/audit-public-installer-package \
            --kind macos \
            --artifact "$REMOTE_DIST/ContextLattice-macOS-universal.dmg" \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-macOS-universal.dmg.package-audit.json"

      - name: Upload remote DMG audit receipt
        uses: actions/upload-artifact@v7
        with:
          name: public-release-remote-dmg-package-audit
          path: ${{ runner.temp }}/ContextLattice-macOS-universal.dmg.package-audit.json
          if-no-files-found: error

  audit-remote-linux-msi:
    name: Independently audit downloaded remote Linux and MSI packages
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - publish-assets
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]

      - name: Install and attest MSI audit tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          msitools_version='0.103-3build1'
          bubblewrap_version='0.9.0-1ubuntu0.1'
          sudo apt-get install -y "msitools=${msitools_version}" "bubblewrap=${bubblewrap_version}"
          test "$(dpkg-query -W -f='${Version}' msitools)" = "$msitools_version"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$bubblewrap_version"
          for tool in bwrap msiinfo msiextract; do
            tool_path="$(command -v "$tool")"
            test -x "$tool_path"
            "$tool" --version
            sha256sum "$tool_path"
          done

      - name: Download Linux and MSI installers from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]]
          remote_dist="$(mktemp -d "$RUNNER_TEMP/public-release-remote-linux-msi.XXXXXX")"
          echo "REMOTE_DIST=$remote_dist" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ContextLattice-linux-bootstrap.tar.gz \
            --dir "$remote_dist"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ContextLattice-windows-x64.msi \
            --dir "$remote_dist"

      - name: Audit downloaded Linux and MSI package contents
        run: |
          set -euo pipefail
          scripts/agent/audit-public-installer-package \
            --kind linux \
            --artifact "$REMOTE_DIST/ContextLattice-linux-bootstrap.tar.gz" \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-linux-bootstrap.tar.gz.package-audit.json"
          scripts/agent/audit-public-installer-package \
            --kind windows \
            --artifact "$REMOTE_DIST/ContextLattice-windows-x64.msi" \
            --root . \
            --lane public \
            --tag "$RELEASE_TAG" \
            --containment-tool bwrap \
            --temp-dir "$RUNNER_TEMP" \
            --receipt-out "$RUNNER_TEMP/ContextLattice-windows-x64.msi.package-audit.json"

      - name: Upload remote Linux and MSI audit receipts
        uses: actions/upload-artifact@v7
        with:
          name: public-release-remote-linux-msi-package-audits
          path: |
            ${{ runner.temp }}/ContextLattice-linux-bootstrap.tar.gz.package-audit.json
            ${{ runner.temp }}/ContextLattice-windows-x64.msi.package-audit.json
          if-no-files-found: error

  promote-release:
    name: Promote independently audited draft release
    if: github.repository == 'sheawinkler/ContextLattice'
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - publish-assets
      - audit-remote-macos
      - audit-remote-linux-msi
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: Reverify exact source commit
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_COMMIT" ]]
          echo "RELEASE_COMMIT=$EXPECTED_RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Download digest-bound native audit receipts
        uses: actions/download-artifact@v8
        with:
          pattern: public-release-remote-*-package-audit*
          path: ${{ runner.temp }}/remote-package-audits
          merge-multiple: true

      - name: Download and audit the complete remote draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
            echo "ERROR: release was promoted before final audit." >&2
            exit 1
          }
          remote_dist="$(mktemp -d "$RUNNER_TEMP/public-release-remote.XXXXXX")"
          echo "FINAL_AUDITED_REMOTE_DIST=$remote_dist" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_dist"
          expected=(
            ContextLattice-macOS-universal.dmg
            ContextLattice-linux-bootstrap.tar.gz
            ContextLattice-windows-x64.msi
            ContextLattice-SHA256SUMS.txt
            ContextLattice-release-manifest-stable.json
            ContextLattice-release-provenance.json
            ContextLattice-macOS-universal.dmg.integrity.json
            ContextLattice-windows-x64.msi.integrity.json
            ContextLattice-linux-bootstrap.tar.gz.integrity.json
            ContextLattice-macOS-universal.dmg.sbom.spdx.json
            ContextLattice-windows-x64.msi.sbom.spdx.json
            ContextLattice-linux-bootstrap.tar.gz.sbom.spdx.json
          )
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort)"
          actual_sorted="$(find "$remote_dist" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual_sorted" == "$expected_sorted" ]] || {
            echo "ERROR: remote draft asset set is not exact." >&2
            printf '%s\n' "$actual_sorted" >&2
            exit 1
          }
          for installer in \
            ContextLattice-macOS-universal.dmg \
            ContextLattice-windows-x64.msi \
            ContextLattice-linux-bootstrap.tar.gz; do
            scripts/agent/verify-release-sbom-binding \
              --artifact "$remote_dist/$installer" \
              --sbom "$remote_dist/$installer.sbom.spdx.json" \
              --receipt "$remote_dist/$installer.integrity.json" \
              --lane public \
              --tag "$RELEASE_TAG" \
              --commit "$RELEASE_COMMIT"
          done
          for row in \
            'macos ContextLattice-macOS-universal.dmg' \
            'linux ContextLattice-linux-bootstrap.tar.gz' \
            'windows ContextLattice-windows-x64.msi'; do
            read -r kind name <<<"$row"
            scripts/agent/audit-public-installer-package \
              --kind "$kind" \
              --artifact "$remote_dist/$name" \
              --root . \
              --lane public \
              --tag "$RELEASE_TAG" \
              --temp-dir "$RUNNER_TEMP" \
              --containment-tool bwrap \
              --receipt-in "$RUNNER_TEMP/remote-package-audits/$name.package-audit.json" \
              --verify-receipt-only
          done
          scripts/agent/audit-public-release-assets \
            --dist-dir "$remote_dist" \
            --lane public \
            --channel stable \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Promote audited draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]] || {
            echo "ERROR: release was promoted before final audit." >&2
            exit 1
          }
          recheck_dist="$(mktemp -d "$RUNNER_TEMP/public-release-promotion-recheck.XXXXXX")"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$recheck_dist"
          audited_names="$(find "$FINAL_AUDITED_REMOTE_DIST" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          recheck_names="$(find "$recheck_dist" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$recheck_names" == "$audited_names" ]] || {
            echo "ERROR: remote draft asset set changed after final audit." >&2
            exit 1
          }
          while IFS= read -r name; do
            cmp -s "$FINAL_AUDITED_REMOTE_DIST/$name" "$recheck_dist/$name" || {
              echo "ERROR: remote draft asset bytes changed after final audit: $name" >&2
              exit 1
            }
          done <<<"$audited_names"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == false ]] || {
            echo "ERROR: audited release did not promote." >&2
            exit 1
          }
