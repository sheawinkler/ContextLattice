name: Public product truth

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/pull_request_template.md"
      - "README.md"
      - "LICENSE"
      - "Makefile"
      - "config/commercial_truth.v1.json"
      - "crates/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "contextlattice-dashboard/**"
      - "docs/public_overview/**"
      - "docs/readme/**"
      - "docs/releases/**"
      - "docs/host-supervisor-release-safety.md"
      - "packaging/**"
      - "scripts/build_release_payload.sh"
      - "scripts/install_global_agent_tools.sh"
      - "scripts/install_retention_runner.sh"
      - ".env.example"
      - "scripts/install_global_agent_tools.ps1"
      - "scripts/install_orbstack_self_heal_runner.sh"
      - "scripts/orbstack_self_heal.sh"
      - "scripts/public_sync_guard.sh"
      - "scripts/task_agent_worker.py"
      - "scripts/agent_hooks/public_leak_guard.sh"
      - "scripts/agent/audit-public-product-truth"
      - "scripts/agent/audit-public-installer-package"
      - "scripts/agent/audit-agent-global-install-smoke"
      - "scripts/agent/audit-host-supervisor-safety"
      - "scripts/generate_commercial_truth.py"
      - "scripts/install_public_overview_sync.sh"
      - "scripts/sync_public_overview.sh"
      - "scripts/tests/test_commercial_truth.py"
      - "scripts/tests/test_host_supervisor_safety_audit.py"
      - "scripts/tests/test_orbstack_self_heal_install.py"
      - "scripts/tests/test_retention_runner_install.py"
      - "scripts/tests/test_public_boundary_guards.py"
      - "scripts/tests/test_public_product_truth.py"
      - "scripts/tests/test_public_release_package_scan.py"
      - "scripts/tests/test_public_release_workflow.py"
      - "scripts/tests/test_task_agent_worker_claim_identity.py"
      - "scripts/tests/test_t*_public_projection.py"
      - "services/gateway-go/commercial_contract_generated.go"
      - "services/gateway-go/commercial_contract_generated_test.go"
      - ".github/workflows/public-release-installers.yml"
      - ".github/workflows/public-product-truth.yml"
  push:
    branches:
      - main
      - public-paid/main
    paths:
      - "AGENTS.md"
      - ".github/pull_request_template.md"
      - "README.md"
      - "LICENSE"
      - "Makefile"
      - "config/commercial_truth.v1.json"
      - "crates/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "contextlattice-dashboard/**"
      - "docs/public_overview/**"
      - "docs/readme/**"
      - "docs/releases/**"
      - "docs/host-supervisor-release-safety.md"
      - "packaging/**"
      - "scripts/build_release_payload.sh"
      - "scripts/install_global_agent_tools.sh"
      - "scripts/install_retention_runner.sh"
      - ".env.example"
      - "scripts/install_global_agent_tools.ps1"
      - "scripts/install_orbstack_self_heal_runner.sh"
      - "scripts/orbstack_self_heal.sh"
      - "scripts/public_sync_guard.sh"
      - "scripts/task_agent_worker.py"
      - "scripts/agent_hooks/public_leak_guard.sh"
      - "scripts/agent/audit-public-product-truth"
      - "scripts/agent/audit-public-installer-package"
      - "scripts/agent/audit-agent-global-install-smoke"
      - "scripts/agent/audit-host-supervisor-safety"
      - "scripts/generate_commercial_truth.py"
      - "scripts/install_public_overview_sync.sh"
      - "scripts/sync_public_overview.sh"
      - "scripts/tests/test_commercial_truth.py"
      - "scripts/tests/test_host_supervisor_safety_audit.py"
      - "scripts/tests/test_orbstack_self_heal_install.py"
      - "scripts/tests/test_retention_runner_install.py"
      - "scripts/tests/test_public_boundary_guards.py"
      - "scripts/tests/test_public_product_truth.py"
      - "scripts/tests/test_public_release_package_scan.py"
      - "scripts/tests/test_public_release_workflow.py"
      - "scripts/tests/test_task_agent_worker_claim_identity.py"
      - "scripts/tests/test_t*_public_projection.py"
      - "services/gateway-go/commercial_contract_generated.go"
      - "services/gateway-go/commercial_contract_generated_test.go"
      - ".github/workflows/public-release-installers.yml"
      - ".github/workflows/public-product-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-product-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go for workflow syntax validation
        uses: actions/setup-go@v6
        with:
          go-version-file: services/gateway-go/go.mod
          cache: false
      - name: Enforce host lifecycle PR evidence
        if: github.event_name == 'pull_request'
        env:
          CONTEXTLATTICE_PR_BODY: ${{ github.event.pull_request.body }}
          CONTEXTLATTICE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTEXTLATTICE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --name-only "$CONTEXTLATTICE_PR_BASE_SHA" "$CONTEXTLATTICE_PR_HEAD_SHA" |
          python3 scripts/agent/audit-host-supervisor-safety
          --changed-files-stdin
          --pr-body-env CONTEXTLATTICE_PR_BODY
          --pretty
      - name: Compile deterministic truth tooling
        run: >-
          python3 -m py_compile
          scripts/generate_commercial_truth.py
          scripts/agent/audit-public-product-truth
          scripts/agent/audit-public-installer-package
          scripts/agent/audit-host-supervisor-safety
      - name: Verify generated commercial truth
        run: python3 scripts/generate_commercial_truth.py --check
      - name: Run focused truth-contract tests
        run: >-
          python3 -m unittest
          scripts.tests.test_public_product_truth
          scripts.tests.test_public_release_package_scan
          scripts.tests.test_public_release_workflow
          scripts.tests.test_task_agent_worker_claim_identity
          scripts.tests.test_host_supervisor_safety_audit
          scripts.tests.test_retention_runner_install
          scripts.tests.test_commercial_truth.CommercialTruthTests.test_contract_decisions
          scripts.tests.test_commercial_truth.CommercialTruthTests.test_public_projection_has_no_private_paths
      - name: Validate active release workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          actionlint_bin="$RUNNER_TEMP/actionlint-bin/actionlint"
          GOBIN="$(dirname "$actionlint_bin")" \
            go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          "$actionlint_bin" -oneline \
            .github/workflows/public-release-installers.yml \
            .github/workflows/public-product-truth.yml
      - name: Prove fail-closed host supervision
        run: |
          python3 scripts/agent/audit-host-supervisor-safety --pretty
          python3 scripts/tests/test_orbstack_self_heal_install.py
      - name: Audit public-facing product truth
        shell: bash
        run: |
          lane="commercial"
          if [[ "${GITHUB_REPOSITORY}" == "sheawinkler/ContextLattice" ]]; then
            lane="public"
          fi
          scripts/agent/audit-public-product-truth --lane "${lane}" --pretty
