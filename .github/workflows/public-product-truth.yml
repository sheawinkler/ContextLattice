name: Public product truth

on:
  pull_request:
    paths:
      - "README.md"
      - "LICENSE"
      - "Makefile"
      - "config/commercial_truth.v1.json"
      - "crates/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "contextlattice-dashboard/**"
      - "docs/public_overview/**"
      - "docs/readme/**"
      - "docs/releases/**"
      - "packaging/**"
      - "scripts/build_release_payload.sh"
      - "scripts/install_global_agent_tools.sh"
      - "scripts/install_global_agent_tools.ps1"
      - "scripts/install_orbstack_self_heal_runner.sh"
      - "scripts/orbstack_self_heal.sh"
      - "scripts/public_sync_guard.sh"
      - "scripts/agent_hooks/public_leak_guard.sh"
      - "scripts/agent/audit-public-product-truth"
      - "scripts/generate_commercial_truth.py"
      - "scripts/install_public_overview_sync.sh"
      - "scripts/sync_public_overview.sh"
      - "scripts/tests/test_commercial_truth.py"
      - "scripts/tests/test_orbstack_self_heal_install.py"
      - "scripts/tests/test_public_boundary_guards.py"
      - "scripts/tests/test_public_product_truth.py"
      - "scripts/tests/test_t*_public_projection.py"
      - "services/gateway-go/commercial_contract_generated.go"
      - "services/gateway-go/commercial_contract_generated_test.go"
      - ".github/workflows/release-installers.yml"
      - ".github/workflows/public-product-truth.yml"
  push:
    branches:
      - main
      - public-paid/main
    paths:
      - "README.md"
      - "LICENSE"
      - "Makefile"
      - "config/commercial_truth.v1.json"
      - "crates/Cargo.toml"
      - "crates/**/Cargo.toml"
      - "contextlattice-dashboard/**"
      - "docs/public_overview/**"
      - "docs/readme/**"
      - "docs/releases/**"
      - "packaging/**"
      - "scripts/build_release_payload.sh"
      - "scripts/install_global_agent_tools.sh"
      - "scripts/install_global_agent_tools.ps1"
      - "scripts/install_orbstack_self_heal_runner.sh"
      - "scripts/orbstack_self_heal.sh"
      - "scripts/public_sync_guard.sh"
      - "scripts/agent_hooks/public_leak_guard.sh"
      - "scripts/agent/audit-public-product-truth"
      - "scripts/generate_commercial_truth.py"
      - "scripts/install_public_overview_sync.sh"
      - "scripts/sync_public_overview.sh"
      - "scripts/tests/test_commercial_truth.py"
      - "scripts/tests/test_orbstack_self_heal_install.py"
      - "scripts/tests/test_public_boundary_guards.py"
      - "scripts/tests/test_public_product_truth.py"
      - "scripts/tests/test_t*_public_projection.py"
      - "services/gateway-go/commercial_contract_generated.go"
      - "services/gateway-go/commercial_contract_generated_test.go"
      - ".github/workflows/release-installers.yml"
      - ".github/workflows/public-product-truth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-product-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile deterministic truth tooling
        run: python3 -m py_compile scripts/generate_commercial_truth.py scripts/agent/audit-public-product-truth
      - name: Verify generated commercial truth
        run: python3 scripts/generate_commercial_truth.py --check
      - name: Run focused truth-contract tests
        run: >-
          python3 -m unittest
          scripts.tests.test_public_product_truth
          scripts.tests.test_commercial_truth.CommercialTruthTests.test_contract_decisions
          scripts.tests.test_commercial_truth.CommercialTruthTests.test_public_projection_has_no_private_paths
      - name: Prove fail-closed host supervision
        run: python3 scripts/tests/test_orbstack_self_heal_install.py
      - name: Audit public-facing product truth
        shell: bash
        run: |
          lane="commercial"
          if [[ "${GITHUB_REPOSITORY}" == "sheawinkler/ContextLattice" ]]; then
            lane="public"
          fi
          scripts/agent/audit-public-product-truth --lane "${lane}" --pretty
