name: contextlattice
version: 0.4.1
kind: exclusive
requires_env:
  - CONTEXTLATTICE_ORCHESTRATOR_API_KEY
description: "ContextLattice memory provider: per-turn scoped recall, native compaction handoff, built-in memory mirroring."
provides_hooks:
  - on_session_start
  - pre_tool_call
  - post_tool_call
hooks:
  - on_pre_compress
  - on_session_switch
  - on_memory_write
  - pre_tool_call
  - post_tool_call
