      SPIKE_DATA_ROOT: /data/memory-bank
      SPIKE_EXACT_STATE_INDEX_PATH: ${SPIKE_EXACT_STATE_INDEX_PATH:-/data/memory-bank/_contextlattice/exact_state_paths.json}
      SPIKE_REFRESH_SECS: ${TRIEVE_SPIKE_ADAPTER_REFRESH_SECS:-120}
      SPIKE_MAX_DOCS: ${TRIEVE_SPIKE_ADAPTER_MAX_DOCS:-50000}
      SPIKE_MAX_CONTENT_CHARS: ${TRIEVE_SPIKE_ADAPTER_MAX_CONTENT_CHARS:-4096}
    volumes:
