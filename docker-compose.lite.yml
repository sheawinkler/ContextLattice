name: ${COMPOSE_PROJECT_NAME:-contextlattice}

services:
  mongo:
    image: mongo:7
    volumes: ["${MONGO_DATA:-mongo_data}:/data/db"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:6333:6333", "${HOST_BIND_ADDRESS:-127.0.0.1}:6334:6334"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes: ["${QDRANT_STORAGE:-qdrant_storage}:/qdrant/storage"]
    restart: unless-stopped

  memorymcp-http:
    build: { context: ., dockerfile: Dockerfile.memorymcp }
    depends_on: [mongo]
    environment:
      MEMORYMCP_HTTP_PORT: ${MEMORYMCP_HTTP_PORT:-59081}
      MEMORY_BANK_ROOT: /data/memory-bank
      CONTEXTLATTICE_OWNER_ONLY_WRITER_POLICY: owner_only_writer.v2
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
    volumes: ["${MEMORY_BANK_DATA:-memory_bank_data}:/data"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${SUPERGW_PORT:-59081}:${MEMORYMCP_HTTP_PORT:-59081}"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${MEMORYMCP_HTTP_PORT:-59081}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mcp-hub:
    image: ghcr.io/tbxark/mcp-proxy:v0.43.2
    depends_on:
      memorymcp-http:
        condition: service_healthy
    volumes:
      - ./config/mcp/mcp-hub.lite.json:/config/config.json:ro
    command: ["--config", "/config/config.json"]
    ports: ["${HOST_BIND_ADDRESS:-127.0.0.1}:${MCP_HUB_PORT:-53130}:${MCP_HUB_PORT:-53130}"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        ["CMD-SHELL",
         "bash -lc 'timeout 3 bash -lc \"exec 3<>/dev/tcp/127.0.0.1/${MCP_HUB_PORT:-53130}; exec 3>&-\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fastembed-sidecar:
    build: { context: ., dockerfile: Dockerfile.fastembed }
    environment:
      FASTEMBED_DEFAULT_MODEL: ${FASTEMBED_DEFAULT_MODEL:-BAAI/bge-small-en-v1.5}
      FASTEMBED_CACHE_DIR: /models
      FASTEMBED_MAX_BATCH: ${FASTEMBED_MAX_BATCH:-256}
    volumes:
      - ${FASTEMBED_MODEL_CACHE:-fastembed_model_cache}:/models
    expose: ["8080"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  meilisearch:
    profiles: ["advanced"]
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-contextlattice_meili_dev_key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${MEILI_DATA:-meili_data}:/meili_data
    expose: ["7700"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lancedb-spike-adapter:
    profiles: ["advanced"]
    build: { context: ., dockerfile: Dockerfile.lancedb-spike-adapter }
    depends_on:
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${LANCEDB_SPIKE_PORT_INTERNAL:-8097}
      LANCEDB_SPIKE_DATA_ROOT: /data/memory-bank
      SPIKE_EXACT_STATE_INDEX_PATH: ${SPIKE_EXACT_STATE_INDEX_PATH:-/data/memory-bank/_contextlattice/exact_state_paths.json}
      LANCEDB_SPIKE_DB_URI: ${LANCEDB_SPIKE_DB_URI:-/var/lib/contextlattice/lancedb}
      LANCEDB_SPIKE_TABLE: ${LANCEDB_SPIKE_TABLE:-memory_bank}
      LANCEDB_SPIKE_REFRESH_SECS: ${LANCEDB_SPIKE_REFRESH_SECS:-120}
      LANCEDB_SPIKE_MAX_DOCS: ${LANCEDB_SPIKE_MAX_DOCS:-50000}
      LANCEDB_SPIKE_MAX_CONTENT_CHARS: ${LANCEDB_SPIKE_MAX_CONTENT_CHARS:-4096}
    volumes:
      - ${MEMORY_BANK_DATA:-memory_bank_data}:/data:ro
      - ${LANCEDB_SPIKE_DATA:-lancedb_spike_data}:/var/lib/contextlattice/lancedb
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${LANCEDB_SPIKE_PORT:-8097}:${LANCEDB_SPIKE_PORT_INTERNAL:-8097}"
    expose: ["${LANCEDB_SPIKE_PORT_INTERNAL:-8097}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LANCEDB_SPIKE_PORT_INTERNAL:-8097}/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
    restart: unless-stopped

  trieve-spike-adapter:
