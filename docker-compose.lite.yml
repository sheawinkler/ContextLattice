  memory-bank-spike-rs:
    profiles: ["advanced"]
    build: { context: ., dockerfile: Dockerfile.memory-bank-spike-rs }
    depends_on:
      meilisearch:
        condition: service_started
      lancedb-spike-adapter:
        condition: service_started
      trieve-spike-adapter:
        condition: service_started
      helixdb-spike-adapter:
        condition: service_started
      icm-spike-adapter:
        condition: service_started
      shodh-spike-adapter:
        condition: service_started
      memvid-spike-adapter:
        condition: service_started
      surrealdb-spike-adapter:
        condition: service_started
      memorymcp-http:
        condition: service_started
    environment:
      PORT: ${MEMORY_BANK_SPIKE_RS_PORT_INTERNAL:-8096}
      MB_SPIKE_DATA_ROOT: /data/memory-bank
      MB_SPIKE_EXACT_STATE_INDEX_PATH: ${MB_SPIKE_EXACT_STATE_INDEX_PATH:-/data/memory-bank/_contextlattice/exact_state_paths.json}
      MB_SPIKE_REFRESH_SECS: ${MEMORY_BANK_SPIKE_RS_REFRESH_SECS:-120}
      MB_SPIKE_MAX_DOCS: ${MEMORY_BANK_SPIKE_RS_MAX_DOCS:-50000}
      MB_SPIKE_MAX_CONTENT_CHARS: ${MEMORY_BANK_SPIKE_RS_MAX_CONTENT_CHARS:-4096}
      MB_SPIKE_MEILI_URL: ${MEMORY_BANK_SPIKE_RS_MEILI_URL:-http://meilisearch:7700}
      MB_SPIKE_MEILI_API_KEY: ${MEILI_MASTER_KEY:-contextlattice_meili_dev_key}
      MB_SPIKE_MEILI_INDEX: ${MEMORY_BANK_SPIKE_RS_MEILI_INDEX:-contextlattice_memory}
      MB_SPIKE_MEILI_SYNC_SECS: ${MEMORY_BANK_SPIKE_RS_MEILI_SYNC_SECS:-300}
      MB_SPIKE_MEILI_TASK_TIMEOUT_SECS: ${MEMORY_BANK_SPIKE_RS_MEILI_TASK_TIMEOUT_SECS:-30}
      MB_SPIKE_EXTERNAL_TIMEOUT_SECS: ${MEMORY_BANK_SPIKE_RS_EXTERNAL_TIMEOUT_SECS:-3}
      MB_SPIKE_EXTERNAL_TIMEOUT_SECS_ICM: ${MEMORY_BANK_SPIKE_RS_EXTERNAL_TIMEOUT_SECS_ICM:-1}
      MB_SPIKE_LANCEDB_URL: ${MEMORY_BANK_SPIKE_RS_LANCEDB_URL:-http://lancedb-spike-adapter:8097}
      MB_SPIKE_LANCEDB_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_LANCEDB_SEARCH_ROUTE:-/search}
      MB_SPIKE_LANCEDB_API_KEY: ${MEMORY_BANK_SPIKE_RS_LANCEDB_API_KEY:-}
      MB_SPIKE_TRIEVE_URL: ${MEMORY_BANK_SPIKE_RS_TRIEVE_URL:-http://trieve-spike-adapter:8098}
      MB_SPIKE_TRIEVE_SEARCH_ROUTE: ${MEMORY_BANK_SPIKE_RS_TRIEVE_SEARCH_ROUTE:-/search}
      MB_SPIKE_TRIEVE_API_KEY: ${MEMORY_BANK_SPIKE_RS_TRIEVE_API_KEY:-}
