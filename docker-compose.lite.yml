      CONTEXTLATTICE_GO_ORCHESTRATOR_URL: ${CONTEXTLATTICE_GO_ORCHESTRATOR_URL:-http://orchestrator-go:8090}
      MIGRATION_SHADOW_DUAL_RUN: ${MIGRATION_SHADOW_DUAL_RUN:-true}
      MIGRATION_CANARY_ENABLED: ${MIGRATION_CANARY_ENABLED:-true}
      ORCH_SECURITY_STRICT: ${ORCH_SECURITY_STRICT:-false}
      ORCH_PRODUCTION_REQUIRE_API_KEY: ${ORCH_PRODUCTION_REQUIRE_API_KEY:-false}
      ORCH_PUBLIC_STATUS: ${ORCH_PUBLIC_STATUS:-false}
      ORCH_PUBLIC_DOCS: ${ORCH_PUBLIC_DOCS:-false}
      ORCH_PYTHON_HOT_PATH_OWNERSHIP_MODE: ${ORCH_PYTHON_HOT_PATH_OWNERSHIP_MODE:-warn}
      CONTEXTLATTICE_ORCHESTRATOR_API_KEY: ${CONTEXTLATTICE_ORCHESTRATOR_API_KEY:-}
      SECRETS_STORAGE_MODE: ${SECRETS_STORAGE_MODE:-redact}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_LOCAL_URL: ${QDRANT_LOCAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      ORCH_QDRANT_COLLECTION: ${ORCH_QDRANT_COLLECTION:-contextlattice_notes}
      ORCH_EMBED_DIM: ${ORCH_EMBED_DIM:-768}
      ORCH_PGVECTOR_ENABLED: ${ORCH_LITE_PGVECTOR_ENABLED:-false}
      ORCH_PGVECTOR_FANOUT_ENABLED: ${ORCH_PGVECTOR_FANOUT_ENABLED:-false}
      GO_RETRIEVAL_NATIVE_QDRANT_ENABLED: ${GO_LITE_RETRIEVAL_NATIVE_QDRANT_ENABLED:-true}
      GO_WRITE_QDRANT_FANOUT_MODE: ${GO_LITE_WRITE_QDRANT_FANOUT_MODE:-async}
      GO_WRITE_PGVECTOR_FANOUT_MODE: ${GO_LITE_WRITE_PGVECTOR_FANOUT_MODE:-disabled}
      ORCH_RETRIEVAL_SOURCES: ${ORCH_LITE_RETRIEVAL_SOURCES:-qdrant,mongo_raw,topic_rollups}
      ORCH_RETRIEVAL_FAST_SOURCES: ${ORCH_LITE_RETRIEVAL_FAST_SOURCES:-topic_rollups,qdrant}
      ORCH_RETRIEVAL_SLOW_SOURCES: ${ORCH_LITE_RETRIEVAL_SLOW_SOURCES:-mongo_raw}
      ORCH_RUST_RETRIEVAL_VECTOR_BACKEND: ${ORCH_LITE_RUST_RETRIEVAL_VECTOR_BACKEND:-qdrant_remote}
      ORCH_RETRIEVAL_FAIL_OPEN_TIMEOUT_CONTINUATION_SOURCES: ${ORCH_LITE_RETRIEVAL_FAIL_OPEN_TIMEOUT_CONTINUATION_SOURCES:-qdrant,mongo_raw}
      GO_RETRIEVAL_RUST_QUALITY_FALLBACK_SOURCES: ${GO_LITE_RETRIEVAL_RUST_QUALITY_FALLBACK_SOURCES:-qdrant,topic_rollups}
      ORCH_ADAPTER_FASTEMBED_RS_ENABLED: ${ORCH_ADAPTER_FASTEMBED_RS_ENABLED:-true}
      ORCH_ADAPTER_FASTEMBED_RS_REQUIRE_GATE: ${ORCH_ADAPTER_FASTEMBED_RS_REQUIRE_GATE:-false}
      ORCH_ADAPTER_FASTEMBED_RS_GATE_FILE: ${ORCH_ADAPTER_FASTEMBED_RS_GATE_FILE:-/app/data/gates/fastembed_gate_latest.json}
