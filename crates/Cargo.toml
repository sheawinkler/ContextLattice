[workspace]
resolver = "2"
members = [
  "context_codec",
  "context_engine",
  "context_retrieval",
  "context_storage_ops",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
version = "0.1.0"
authors = ["ContextLattice"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
thiserror = "1"
